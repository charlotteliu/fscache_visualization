[project]
name = "fscache-visualization"
version = "0.1.0"
description = "Private Streamlit treemap visualization for folder trees and cold-page CSV exports."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.2",
    "plotly>=5.22",
    "streamlit>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
